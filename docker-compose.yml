name: score-client-socket

# Standalone: runs scoreClientSocket only (no ScoreProvider, no real score data).
# Use this when developing the socket layer in isolation.
#
# To run BOTH services together use the root docker-compose.yml instead:
#   cd .. && docker compose up --build
#
# Usage (this file):
#   docker compose up --build          # socket only
#   docker compose down

services:

  # ── scoreClientSocket ─────────────────────────────────────────────────────
  scoreClientSocket:
    build:
      context: .
      dockerfile: Dockerfile
    image: scoreclientsocket:local
    container_name: scoreClientSocket
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Port: ""                          # blank = use PORT env (8080 inside container)
      Hubettings__HubName: clientScore
      Hubettings__HubKeepLiveSecond: "20"
      TZ: Asia/Kolkata
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/ip > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ── scoreprovider (optional — include to test full stack locally) ────────────
  # scoreprovider:
  #   image: scoreprovider:local        # build ScoreProvider separately first
  #   container_name: scoreprovider
  #   ports:
  #     - "5000:8080"
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: Development
  #     TZ: Asia/Kolkata
  #     BackgroundWorker__Enabled: "true"
  #     # Tell ScoreProvider to connect to scoreClientSocket inside the compose network:
  #     ScoreProviderSockets__0: http://scoreClientSocket:8080/clientScore
  #   depends_on:
  #     scoreClientSocket:
  #       condition: service_healthy
  #   restart: unless-stopped
